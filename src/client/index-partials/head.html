<!DOCTYPE html>
<html lang="ru">
<head>
  <script>
    (function () {
      let theme = "light";
      try {
        theme = localStorage.getItem("app_theme") || "light";
      } catch (error) {
        console.warn("Не удалось прочитать сохранённую тему", error);
      }
      const normalizedTheme = theme === "light" ? "light" : "dark";
      const className = normalizedTheme === "light" ? "theme-light" : "theme-dark";
      const backgroundColor = normalizedTheme === "light" ? "#f6f6f7" : "#131416";

      window.__appThemeClass = className;
      document.documentElement.classList.add(className);
      document.documentElement.style.colorScheme = normalizedTheme;
      document.documentElement.style.backgroundColor = backgroundColor;

      if (document.body) {
        document.body.classList.add(className);
        return;
      }

      document.addEventListener(
        "DOMContentLoaded",
        () => {
          document.body.classList.add(className);
        },
        { once: true }
      );
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Axis</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <meta id="appThemeColor" name="theme-color" content="#131416">
  <script>
    document.getElementById("appThemeColor").content =
      window.__appThemeClass === "theme-light" ? "#f6f6f7" : "#131416";
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Axis">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=83" />
  <link rel="stylesheet" href="liquid-glass.css?v=1" />
