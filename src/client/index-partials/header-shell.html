<body class="home-page">
  <script>
    document.body.classList.add(window.__appThemeClass || "theme-dark");
  </script>
  <!-- =======================
       HEADER
       ======================= -->
  <header>
    <button class="brand" type="button" data-workspace-home data-i18n-aria="overview">
        <span class="brand-title">Axis</span>
    </button>


    <!-- Правая панель: дата и профиль -->
    <div class="header-actions">
      <select id="workspaceLanguage" class="language-select" aria-label="Workspace language"><option value="ru">RU</option><option value="en">EN</option></select>
      <input id="date" type="date" class="header-date-input" hidden />
      <button id="themeToggleBtn" class="header-icon-btn theme-toggle-btn" aria-label="Сменить тему">
        <span class="theme-toggle-icon"></span>
      </button>
    </div>
  </header>

  <!-- =======================
       MAIN
       ======================= -->
  <a class="skip-link" href="#workspaceContent" data-i18n="skipContent">Перейти к содержимому</a>
  <main id="workspaceContent" tabindex="-1">
    <!-- Блок выбора конструкции и проекта -->
    <div class="construction-bar">
      <div class="project-select-wrapper">
        <label class="construction-label" for="projectSelector" data-i18n="project">Объект</label>
        <select id="projectSelector" class="project-select ui-select"></select>
      </div>
      <div class="construction-select-wrapper">
        <label class="construction-label" for="constructionCategory" data-i18n="category">Категория</label>
        <select id="constructionCategory" class="ui-select"></select>
      </div>
      <div class="construction-select-wrapper" id="constructionFieldShell">
        <label class="construction-label" for="constructionType" data-i18n="construction">Конструкция</label>
        <select id="constructionType" class="ui-select"></select>
        <select id="construction" class="ui-select" hidden aria-hidden="true" tabindex="-1">
          <option value="Плита" selected>Плита</option>
          <option value="Колонна">Колонна</option>
          <option value="Стена">Стена</option>
          <option value="Лестница">Лестница</option>
          <option value="Балка">Балка</option>
          <option value="Элемент">Элемент</option>
        </select>
      </div>
      <div class="construction-select-wrapper" id="constructionSubtypeShell" hidden>
        <label class="construction-label" id="constructionSubtypeLabel" data-i18n="subtype">Подтип</label>
        <select id="constructionSubtype" class="ui-select"></select>
      </div>
      <div class="construction-select-wrapper" id="constructionPileElementShell" hidden>
        <label class="construction-label" id="constructionPileElementLabel">Элемент</label>
        <select id="constructionPileElement" class="ui-select">
          <option value="pile">Свая</option>
          <option value="grillage">Ростверк</option>
        </select>
      </div>
      <details class="bim-import-wrapper" id="bimModelManager">
        <summary class="bim-import-head">
          <span class="construction-label">BIM / IFC</span>
          <span id="bimImportedIfcCount" class="bim-import-count" aria-live="polite" aria-label="Количество загруженных IFC-файлов">
            IFC: 0
          </span>
        </summary>
        <div class="module-help-content" id="bimImportHelpContent" hidden>
          Загрузите IFC-файл, чтобы добавить BIM-элементы проекта и использовать их в модулях контроля.
        </div>
        <div class="bim-import-controls">
          <button type="button" id="btnImportIfc" class="btn-small btn-secondary lg-btn lg-btn--pill bim-import-action bim-import-primary">
            <span class="lg-btn__label" data-i18n="chooseIfc">Выбрать IFC</span>
            <span class="lg-btn__glow" aria-hidden="true"></span>
          </button>
          <input id="ifcFileInput" type="file" accept=".ifc" hidden />
          <div class="bim-import-meta" aria-live="polite">
            <div id="bimImportFileState" class="bim-import-file-state">Файл не выбран</div>
            <div id="bimImportStatus" class="caption bim-import-status"></div>
          </div>
          <div class="bim-import-menu">
            <button
              type="button"
              id="btnIfcMoreActions"
              class="btn-small btn-secondary lg-btn lg-btn--pill bim-import-action bim-import-menu-trigger"
              aria-label="Дополнительные действия IFC"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="ifcActionsMenu"
            >
              <span class="lg-btn__label" aria-hidden="true">⋯</span>
              <span class="lg-btn__glow" aria-hidden="true"></span>
            </button>
            <div id="ifcActionsMenu" class="menu-panel bim-import-menu-panel" role="menu">
              <button type="button" id="btnChooseAnotherIfc" class="menu-item" role="menuitem" data-i18n="chooseAnotherIfc">Выбрать другой IFC</button>
              <button type="button" id="btnResetSelectedIfc" class="menu-item" role="menuitem" data-i18n="resetIfc">Очистить выбранный файл</button>
              <button type="button" id="btnClearIfcImport" class="menu-item menu-danger" role="menuitem" data-i18n="deleteBim">Удалить BIM-элементы</button>
            </div>
          </div>
        </div>
      </details>
    </div>

    <!-- Navigation icons: Lucide, ISC license in icons/LUCIDE-LICENSE. -->
    <nav id="workspaceSidebar" class="tabs" aria-label="Разделы приложения" data-i18n-aria="navigation">

        <span class="sidebar-caption" data-i18n="workspace">Рабочая среда</span>
        <button id="sidebarToggle" type="button" aria-controls="sidebarNavigation" aria-expanded="true" aria-label="Свернуть панель"><svg class="sidebar-icon" aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="18" height="18" x="3" y="3" rx="2" />
  <path d="M9 3v18" />
  <path d="m16 15-3-3 3-3" />
</svg>
</button>
      </div>
      <div class="sidebar-scroll" id="sidebarNavigation">

      <button type="button" class="tab lg-btn active" data-target="overview"><svg class="sidebar-icon" aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect width="7" height="9" x="3" y="3" rx="1" />
  <rect width="7" height="5" x="14" y="3" rx="1" />
  <rect width="7" height="9" x="14" y="12" rx="1" />
  <rect width="7" height="5" x="3" y="16" rx="1" />
</svg>

        <span class="lg-btn__label" data-i18n="overview">Обзор объекта</span>
        <span class="lg-btn__glow" aria-hidden="true"></span>
      </button>
      <div class="sidebar-section-label" data-i18n="inspections">Проверки</div>
      <div class="tabs-group" data-tabs-group="inspections">

        <div class="tabs-group-menu" id="inspectionTabsMenu">
          <button type="button" class="tab tabs-group-item" data-target="geo">
            <span class="tabs-group-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
                <circle cx="12" cy="12" r="8"></circle>
              </svg>
            </span>
            <span>
              <strong data-i18n="geodesy">Геодезия</strong>
              <small>Привязка и положение конструкций</small>
            </span>
          </button>
          <button type="button" class="tab tabs-group-item" data-target="reinforcement">
            <span class="tabs-group-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M5 3v18M12 3v18M19 3v18M3 7h18M3 17h18"></path>
              </svg>
            </span>
            <span>
              <strong data-i18n="reinforcement">Армирование</strong>
              <small>Состав и параметры армирования</small>
            </span>
          </button>
          <button type="button" class="tab tabs-group-item" data-target="geometry">
            <span class="tabs-group-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"></path>
                <path d="m4.5 7.8 7.5 4.3 7.5-4.3M12 12v9"></path>
              </svg>
            </span>
            <span>
              <strong data-i18n="geometry">Геометрия</strong>
              <small>Размеры и допустимые отклонения</small>
            </span>
          </button>
          <button type="button" class="tab tabs-group-item" data-target="strength">
            <span class="tabs-group-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M12 3 5 6v5c0 4.8 2.8 8 7 10 4.2-2 7-5.2 7-10V6l-7-3Z"></path>
                <path d="m9 12 2 2 4-4"></path>
              </svg>
            </span>
            <span>
              <strong data-i18n="strength">Прочность</strong>
              <small>Контроль прочности бетона</small>
            </span>
          </button>
        </div>
      </div>
      <button type="button" class="tab lg-btn" data-target="controlPlan"><svg class="sidebar-icon" aria-hidden="true"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>

  <path d="M13 19h8" />
  <path d="m3 17 2 2 4-4" />
  <path d="m3 7 2 2 4-4" />
</svg>

        <span class="lg-btn__label" data-i18n="controlPlan">План контроля</span>
        <span class="lg-btn__glow" aria-hidden="true"></span>
      </button>
      <button type="button" class="tab lg-btn" data-target="summary"><svg class="sidebar-icon" aria-hidden="true"

</svg>

        <span class="lg-btn__label" data-i18n="summary">Итог</span>
        <span class="lg-btn__glow" aria-hidden="true"></span>
      </button>
      <button type="button" class="tab lg-btn" data-target="documents"><svg class="sidebar-icon" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

      <div class="sidebar-account">
  <button id="headerProfileButton" class="account-trigger" type="button" aria-haspopup="menu" aria-controls="accountMenu" aria-expanded="false" data-i18n-aria="profile" aria-label="Профиль">
    <span class="account-avatar"><img id="headerProfileAvatar" alt="" hidden /><svg class="header-profile-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span><span class="account-trigger-name" data-account-name data-i18n="profile">Профиль</span><span class="account-chevron" aria-hidden="true">⌃</span>

    <a class="account-menu-item" href="profile.html" role="menuitem" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span data-i18n="profile">Профиль</span></a>
    <a class="account-menu-item" href="edit-profile.html" role="menuitem" tabindex="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 3-1 3-3 1-2 3 2 2-1 3 2 3 3-1 2 2 3-1 1-3 3-1 1-3-2-2 1-3-3-2-3 1Z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="accountSettings">Настройки аккаунта</span></a>
