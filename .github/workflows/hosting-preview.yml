name: Firebase Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  preview:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: firebase-preview
    concurrency:
      group: axis-preview-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      PREVIEW_PROJECT: ${{ vars.FIREBASE_PREVIEW_PROJECT }}
      PREVIEW_SITE: ${{ vars.FIREBASE_PREVIEW_SITE }}
    steps:
      - name: Resolve the current open pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: 'main',
              head: run.head_repository.owner.login + ':' + run.head_branch
            });
            const pr = pulls.find(p => p.head.sha === run.head_sha && p.head.repo.id === run.head_repository.id);
            if (pr) core.setOutput('number', pr.number);
      - uses: actions/checkout@v4
        if: steps.pr.outputs.number != ''
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.pr.outputs.number != ''
        with:
          name: axis-preview
          path: preview-public
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        if: steps.pr.outputs.number != ''
        with:
          node-version: 22
      - name: Validate isolated destination and write Hosting configuration
        if: steps.pr.outputs.number != ''
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync, readFileSync } from "node:fs";
          const { PREVIEW_PROJECT: project, PREVIEW_SITE: site } = process.env;
          if (!/^axis-preview-[a-z0-9-]+$/.test(project ?? "") ||
              !/^axis-preview-[a-z0-9-]+$/.test(site ?? "")) {
            throw new Error("Configure a separate axis-preview-* Firebase project and site.");
          }
          const config = readFileSync("preview-public/dist/firebase.js", "utf8");
          if (!config.includes('projectId: "demo-project"')) {
            throw new Error("Expected the synthetic preview client.");
          }
          writeFileSync("firebase.json", JSON.stringify({
            hosting: {
              site, public: "preview-public", ignore: ["**/.*"],
              headers: [{ source: "**", headers: [
                { key: "Content-Security-Policy", value: "connect-src 'self'; frame-src 'none'; form-action 'self'; object-src 'none'; base-uri 'self'" },
                { key: "X-Content-Type-Options", value: "nosniff" }
              ] }]
            }
          }));
          JS
          npm install --global firebase-tools@15.33.0
      - name: Authenticate to the preview project
        if: steps.pr.outputs.number != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Publish preview URL
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          firebase hosting:channel:deploy "pr-$PR_NUMBER" --expires 7d --project "$PREVIEW_PROJECT" --no-authorized-domains --non-interactive --json > preview-result.json
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from "node:fs";
          const { result } = JSON.parse(readFileSync("preview-result.json", "utf8"));
          const url = Object.values(result)[0]?.url;
          if (!url || new URL(url).protocol !== "https:") throw new Error("Hosting preview URL missing.");
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `[Open Axis Preview](${url})\n`);
          JS
