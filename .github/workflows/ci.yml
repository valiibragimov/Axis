name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Synthetic fixtures only; these build artifacts cannot authenticate real users.
      FIREBASE_CONFIG_MODE: test
      FIREBASE_WEB_API_KEY: demo-api-key
      FIREBASE_WEB_AUTH_DOMAIN: demo.firebaseapp.com
      FIREBASE_WEB_PROJECT_ID: demo-project
      FIREBASE_WEB_STORAGE_BUCKET: demo.appspot.com
      FIREBASE_WEB_MESSAGING_SENDER_ID: "000000000000"
      FIREBASE_WEB_APP_ID: "1:000000000000:web:demo"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Setup Java for isolated Firestore tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: API contract
        run: npm run api:check

      - name: Dependency audit
        run: npm run audit:all

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Archive synthetic preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: axis-preview
          path: dist-hosting
          if-no-files-found: error
          retention-days: 2

      - name: Test
        run: npm test

      - name: Firestore integration (synthetic demo project only)
        run: npm run test:integration

      - name: PDF access and immutable versions (synthetic emulators only)
        run: npm run test:documents


  publish:
    name: Publish Axis
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    environment: firebase-production
    concurrency:
      group: axis-hosting-live
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_WEB_AUTH_DOMAIN: axisxyz.web.app
      FIREBASE_WEB_PROJECT_ID: tehnadzor-online
      GCLOUD_PROJECT: tehnadzor-online
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read the public Firebase web app configuration
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from "node:fs";
          const response = await fetch("https://axisxyz.web.app/__/firebase/init.json", { signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Firebase web configuration returned ${response.status}.`);
          const config = await response.json();
          if (config.projectId !== "tehnadzor-online" ||
              config.storageBucket !== "tehnadzor-online.firebasestorage.app" ||
              config.appId !== "1:352129699672:web:d26761698138392a4b9f2d") {
            throw new Error("Hosting returned a different Firebase web app.");
          }
          for (const [name, key] of Object.entries({
            API_KEY: "apiKey", STORAGE_BUCKET: "storageBucket",
            MESSAGING_SENDER_ID: "messagingSenderId", APP_ID: "appId"
          })) {
            if (typeof config[key] !== "string" || !/^[a-zA-Z0-9_.:-]+$/.test(config[key])) {
              throw new Error(`Invalid Firebase web configuration field ${key}.`);
            }
            appendFileSync(process.env.GITHUB_ENV, `FIREBASE_WEB_${name}=${config[key]}` + String.fromCharCode(10));
          }
          JS
      - name: Build production Hosting files
        run: |
          npm ci
          npm run build:client
          npm run build:profile-feed
          npm run build:hosting
          npm run check:hosting -- --production
          npm install --global firebase-tools@15.33.0
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Publish the current main commit to axisxyz
        run: |
          current="$(git ls-remote origin refs/heads/main)"
          current="${current%%$'\t'*}"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists. Skipping this release."
            exit 0
          fi
          firebase deploy --only hosting:axisxyz --project tehnadzor-online --non-interactive
